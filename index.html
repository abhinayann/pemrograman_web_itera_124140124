<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini POS Kantin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Mini POS Kantin Kampus</h1>
  <p>Kasir &amp; keranjang belanja sederhana</p>
</header>

<main>
  <!-- Form input barang -->
  <section>
    <h2>Tambah Barang</h2>
    <form id="formBarang" novalidate>
      <div class="field">
        <label for="nama">Nama Barang</label>
        <input type="text" id="nama" placeholder="Contoh: Buku Tulis">
        <div class="error" id="errNama"></div>
      </div>
      <div class="field">
        <label for="harga">Harga Satuan (Rp)</label>
        <input type="number" id="harga" placeholder="Minimal 500">
        <div class="error" id="errHarga"></div>
      </div>
      <div class="field">
        <label for="qty">Jumlah (Qty)</label>
        <input type="number" id="qty" placeholder="Minimal 1">
        <div class="error" id="errQty"></div>
      </div>
      <button type="submit" class="btn-primary">Tambah ke Keranjang</button>
    </form>
  </section>

  <!-- TAHAP 3 & 2: Tabel keranjang + kalkulator -->
  <section>
    <h2>Keranjang Belanja</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>No</th><th>Nama Barang</th>
            <th class="num">Harga Satuan</th><th class="num">Qty</th>
            <th class="num">Subtotal</th><th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tbodyKeranjang"></tbody>
      </table>
    </div>

    <div class="summary">
      <div class="row"><span>Total Belanja</span><strong id="totalBelanja">Rp 0</strong></div>

      <div class="promo">
        <input type="text" id="kodePromo" placeholder="Kode promo (HEMAT10)" aria-label="Kode promo">
        <button type="button" id="btnPromo">Pakai</button>
      </div>
      <div class="info" id="infoDiskon">Diskon 10% otomatis untuk belanja minimal Rp 50.000, atau gunakan kode HEMAT10.</div>

      <div class="row"><span>Diskon</span><strong id="nominalDiskon">- Rp 0</strong></div>
      <div class="row total"><span>Total Akhir</span><span id="totalAkhir">Rp 0</span></div>

      <div class="field" style="margin-top:14px">
        <label for="uangBayar">Uang Bayar (Rp)</label>
        <input type="number" id="uangBayar" placeholder="Nominal uang diterima">
      </div>
      <div class="row"><span>Kembalian</span><strong id="kembalian">Rp 0</strong></div>
      <div class="status neutral" id="statusBayar"></div>

      <button type="button" class="btn-reset" id="btnReset">Transaksi Baru / Reset</button>
    </div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
